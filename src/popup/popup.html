<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitBoard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>GitBoard</h1>
      <p class="lead">Субтаски на GitHub Projects едут за родительской задачей и могут прятаться в её список.</p>

      <label class="check"><input id="groupEnabled" type="checkbox"> Группировать субтаски списком</label>

      <label class="token" for="token">Токен GitHub API, если сессии страницы недостаточно</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
      <div class="row">
        <button id="save" type="button">Сохранить токен</button>
        <button id="check" type="button">Проверить</button>
      </div>
      <p id="result" class="result"></p>
      <p class="note">Без токена запросы идут от вашего входа на github.com. Токен нужен только как запасной путь: fine-grained с правом записи в Projects и Issues. Он хранится локально в этом браузере.</p>
    </main>
    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
