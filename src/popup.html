<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>GitBoard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>GitBoard</h1>
    <p class="lead">Настройки для открытой доски GitHub Projects. Они же есть на самой доске, в левом нижнем углу.</p>
    <label><input type="checkbox" data-key="follow"> Переносить субтаски вместе с задачей</label>
    <label><input type="checkbox" data-key="addMissing"> Добавлять субтаск на доску, если его ещё нет</label>
    <label><input type="checkbox" data-key="group"> Группировать субтаски списком</label>
    <script src="popup.js"></script>
  </body>
</html>
